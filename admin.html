<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>野保平台 · 多租户管理端（交互原型）</title>
<style>
/* ============================================================
   野保平台 · 多租户管理端 交互原型
   设计系统：森林绿主题 / 专业后台风格 / 纯原生实现，无外部依赖
   ============================================================ */
:root{
  --primary:#2E7D5B; --primary-dark:#1B5E40; --primary-deep:#134A33; --primary-light:#E8F3EE;
  --sidebar-bg:#16382A; --sidebar-hover:#1F4A38; --sidebar-text:#9DBBAD; --sidebar-active:#2E7D5B;
  --bg:#F4F6F5; --card:#FFFFFF; --border:#E5EAE7; --border-strong:#D5DDD8;
  --text:#1F2D27; --text-2:#5B6B63; --text-3:#93A199;
  --danger:#D64545; --danger-bg:#FBEDED; --warning:#E8960C; --warning-bg:#FDF3E3;
  --success:#2E7D5B; --success-bg:#E8F3EE; --info:#2D6FB8; --info-bg:#EBF2FA;
  --gray:#8A9690; --gray-bg:#F0F2F1;
  --radius:10px; --radius-sm:6px;
  --shadow:0 2px 8px rgba(22,56,42,.06); --shadow-lg:0 12px 32px rgba(22,56,42,.16);
  --font:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;
  --mono:'SF Mono',Consolas,'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CBD5CF;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 通用图标 ---------- */
.icon{display:inline-block;vertical-align:-3px;flex-shrink:0}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 16px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:all .16s ease;white-space:nowrap;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:var(--primary);opacity:.55}
.btn-default{background:#fff;color:var(--text-2);border-color:var(--border-strong)}
.btn-default:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#B93636}
.btn-danger-ghost{background:var(--danger-bg);color:var(--danger)}
.btn-danger-ghost:hover{background:#F6DADA}
.btn-ghost{color:var(--primary);background:var(--primary-light)}
.btn-ghost:hover{background:#D9EAE2}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-sm svg{width:13px;height:13px}
.btn-lg{height:40px;padding:0 22px;font-size:14px}
.btn-block{width:100%}
.link-btn{color:var(--primary);font-size:13px;padding:2px 6px;border-radius:4px;transition:background .15s}
.link-btn:hover{background:var(--primary-light)}
.link-btn.danger{color:var(--danger)}
.link-btn.danger:hover{background:var(--danger-bg)}
.link-btn.gray{color:var(--text-3)}
.link-btn.gray:hover{background:var(--gray-bg);color:var(--text-2)}
.btn-loading{pointer-events:none}

/* ---------- 表单 ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.field label .req{color:var(--danger);margin-left:2px}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .icon{position:absolute;left:11px;color:var(--text-3);width:16px;height:16px;pointer-events:none}
.input-wrap .input-eye{position:absolute;right:8px;color:var(--text-3);padding:4px;border-radius:4px;display:flex}
.input-wrap .input-eye:hover{color:var(--primary)}
.input,.select,.textarea{width:100%;height:36px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:0 11px;outline:none;transition:border-color .15s,box-shadow .15s;background:#fff}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,125,91,.12)}
.input.has-icon{padding-left:36px}
.input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(214,69,69,.1)}
.input.err:focus{border-color:var(--danger);box-shadow:0 0 0 3px rgba(214,69,69,.12)}
.textarea{height:auto;min-height:72px;padding:9px 11px;resize:vertical;line-height:1.6}
.input:disabled,.select:disabled{background:#F6F8F7;color:var(--text-3);cursor:not-allowed}
.err-msg{display:none;color:var(--danger);font-size:12px;margin-top:5px}
.input.err + .err-msg{display:block}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.hint{font-size:12px;color:var(--text-3);margin-top:5px;line-height:1.5}
.help-note{display:flex;gap:8px;align-items:flex-start;background:var(--info-bg);border:1px solid #D3E3F5;
  border-radius:var(--radius-sm);padding:10px 12px;color:#2A5B8F;font-size:12.5px;line-height:1.6;margin-bottom:16px}
.help-note .icon{width:15px;height:15px;margin-top:1px;color:var(--info)}

/* 复选 */
.checkbox{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--text-2);user-select:none}
.checkbox input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}

/* 开关 */
.switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:#C9D1CC;border-radius:21px;transition:.2s;cursor:pointer}
.switch .slider:before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:var(--primary)}
.switch input:checked + .slider:before{transform:translateX(17px)}
.switch input:disabled + .slider{opacity:.5;cursor:not-allowed}
.switch-label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}

/* ---------- 徽章 ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-success{background:var(--success-bg);color:var(--primary)}
.badge-warning{background:var(--warning-bg);color:#C07B08}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-gray{background:var(--gray-bg);color:var(--gray)}
.badge-role{background:var(--primary-light);color:var(--primary-dark);border-radius:4px;height:20px;padding:0 7px;font-size:12px}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.page{padding:4px 2px 40px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-title h1{font-size:19px;font-weight:600;color:var(--text)}
.page-title p{font-size:13px;color:var(--text-3);margin-top:5px}

/* 统计卡 */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.stat-card{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .15s}
.stat-card:hover{transform:translateY(-2px)}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:22px;height:22px}
.stat-icon.green{background:var(--success-bg);color:var(--primary)}
.stat-icon.orange{background:var(--warning-bg);color:var(--warning)}
.stat-icon.red{background:var(--danger-bg);color:var(--danger)}
.stat-icon.blue{background:var(--info-bg);color:var(--info)}
.stat-info .stat-num{font-size:24px;font-weight:700;line-height:1.1}
.stat-info .stat-label{font-size:12.5px;color:var(--text-3);margin-top:4px}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .search-box{position:relative;display:flex;align-items:center}
.toolbar .search-box .icon{position:absolute;left:10px;color:var(--text-3);width:15px;height:15px;pointer-events:none}
.toolbar .search-box input{width:240px;height:34px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:0 34px 0 33px;outline:none;transition:.15s}
.toolbar .search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,125,91,.12)}
.toolbar .spacer{flex:1}
.toolbar .select{width:auto;height:34px;min-width:120px;font-size:13px}
.filter-pill{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:#fff;color:var(--text-2);font-size:13px}
.filter-pill:hover{border-color:var(--primary);color:var(--primary)}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto}
table.table{width:100%;border-collapse:collapse}
.table th{background:#F8FAF9;text-align:left;font-size:12.5px;color:var(--text-2);font-weight:600;
  padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.table tbody tr{transition:background .12s}
.table tbody tr:hover{background:#FAFCFB}
.table tbody tr:last-child td{border-bottom:none}
.table .cell-main{font-weight:600;color:var(--text)}
.table .cell-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.table .actions{white-space:nowrap;display:flex;gap:2px}
.table .num{font-variant-numeric:tabular-nums}
.table-empty{padding:48px 0;text-align:center;color:var(--text-3)}
.table-empty .icon{width:40px;height:40px;color:#C7D1CB;margin-bottom:10px}
.table-empty p{font-size:13px}
.tenant-tag{display:flex;align-items:center;gap:9px}
.tenant-tag .t-icon{width:32px;height:32px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tenant-tag .t-icon svg{width:16px;height:16px}

/* 配额进度 */
.quota{min-width:120px}
.quota .quota-top{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:5px;font-variant-numeric:tabular-nums}
.quota .quota-bar{height:5px;background:#E8EDEA;border-radius:3px;overflow:hidden}
.quota .quota-bar i{display:block;height:100%;border-radius:3px;background:var(--primary);transition:width .3s}
.quota .quota-bar.warn i{background:var(--warning)}
.quota .quota-bar.danger i{background:var(--danger)}

/* 分页 */
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:14px 4px 0;flex-wrap:wrap}
.pagination .pg-info{font-size:12.5px;color:var(--text-3);margin-right:auto}
.pagination button{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--border-strong);border-radius:6px;
  background:#fff;color:var(--text-2);font-size:13px;transition:.15s}
.pagination button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.pagination button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.pagination button:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 侧边栏 ---------- */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--sidebar-bg);color:var(--sidebar-text);
  display:flex;flex-direction:column;z-index:50;transition:width .2s}
.logo-area{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#3BA37C,#1B5E40);
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.logo-mark svg{width:20px;height:20px}
.logo-text{line-height:1.25}
.logo-text b{display:block;color:#fff;font-size:16px;font-weight:600;letter-spacing:.5px}
.logo-text span{font-size:11px;color:#7DA08F;letter-spacing:1px}
.side-nav{flex:1;overflow-y:auto;padding:12px 0 20px}
.nav-group-title{font-size:11.5px;color:#6E9180;padding:14px 20px 6px;letter-spacing:1px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;margin:2px 10px;border-radius:8px;
  color:var(--sidebar-text);font-size:13.5px;cursor:pointer;transition:all .15s;user-select:none}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item:hover{background:var(--sidebar-hover);color:#E4F0EA}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:500}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#6E9180;line-height:1.7}

/* ---------- 主区域 ---------- */
.main{margin-left:232px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:40}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-3)}
.breadcrumb .crumb-sep{color:#C9D1CC}
.breadcrumb .crumb-cur{color:var(--text-2);font-weight:500}
.topbar-right{display:flex;align-items:center;gap:6px}
.top-icon-btn{position:relative;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:.15s}
.top-icon-btn:hover{background:var(--gray-bg);color:var(--text)}
.top-icon-btn .icon{width:19px;height:19px}
.top-icon-btn .notify-dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.user-menu-btn{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:8px;cursor:pointer;transition:.15s}
.user-menu-btn:hover{background:var(--gray-bg)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#3BA37C,#1B5E40);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex-shrink:0}
.user-menu-btn .u-name{font-size:13px;font-weight:500;color:var(--text)}
.user-menu-btn .icon{width:14px;height:14px;color:var(--text-3)}
.dropdown{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow-lg);min-width:190px;padding:6px;z-index:60;animation:fadeIn .16s ease;display:none}
.dropdown.open{display:block}
.dropdown .dd-head{padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:5px}
.dropdown .dd-head b{display:block;font-size:13.5px}
.dropdown .dd-head span{font-size:12px;color:var(--text-3)}
.dropdown .dd-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:7px;font-size:13px;color:var(--text-2);cursor:pointer;transition:.12s}
.dropdown .dd-item:hover{background:var(--gray-bg);color:var(--text)}
.dropdown .dd-item .icon{width:15px;height:15px}
.dropdown .dd-item.danger{color:var(--danger)}
.dropdown .dd-item.danger:hover{background:var(--danger-bg)}
.dropdown .dd-sep{height:1px;background:var(--border);margin:5px 8px}
.dropdown .dd-notify{display:flex;gap:9px;padding:9px 12px;border-radius:7px;cursor:pointer}
.dropdown .dd-notify:hover{background:var(--gray-bg)}
.dropdown .dd-notify .n-dot{width:7px;height:7px;border-radius:50%;background:var(--info);margin-top:5px;flex-shrink:0}
.dropdown .dd-notify .n-dot.read{background:#C9D1CC}
.dropdown .dd-notify b{font-size:12.5px;font-weight:500;display:block}
.dropdown .dd-notify span{font-size:11.5px;color:var(--text-3)}
.content{padding:22px 24px;flex:1}
.prototype-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#7DA08F;border:1px solid rgba(255,255,255,.15);
  border-radius:20px;padding:2px 9px;margin-bottom:10px}

/* ---------- 登录页 ---------- */
#login-view{display:flex;min-height:100vh;background:var(--bg)}
.login-left{flex:1.15;background:linear-gradient(150deg,#0F2E20 0%,#1B5E40 55%,#2E7D5B 100%);color:#fff;
  display:flex;flex-direction:column;justify-content:center;padding:60px 70px;position:relative;overflow:hidden}
.login-left::before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.07),transparent 65%);top:-180px;right:-160px}
.login-left::after{content:'';position:absolute;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.05),transparent 65%);bottom:-140px;left:-120px}
.login-left .ll-inner{position:relative;z-index:1;max-width:460px}
.ll-logo{display:flex;align-items:center;gap:13px;margin-bottom:48px}
.ll-logo .logo-mark{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.14);backdrop-filter:blur(4px)}
.ll-logo .logo-mark svg{width:24px;height:24px}
.ll-logo b{font-size:21px;font-weight:600;letter-spacing:1px}
.ll-logo span{display:block;font-size:11.5px;color:rgba(255,255,255,.6);letter-spacing:2px;margin-top:2px}
.ll-title{font-size:34px;font-weight:700;line-height:1.35;margin-bottom:14px;letter-spacing:1px}
.ll-sub{font-size:15px;color:rgba(255,255,255,.72);line-height:1.8;margin-bottom:44px}
.ll-points{display:flex;flex-direction:column;gap:14px}
.ll-point{display:flex;align-items:center;gap:11px;font-size:13.5px;color:rgba(255,255,255,.85)}
.ll-point .icon{width:17px;height:17px;color:#6FCF9F}
.login-right{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.login-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-lg);padding:40px 38px}
.login-card h2{font-size:21px;font-weight:600;margin-bottom:6px}
.login-card .lc-sub{font-size:13px;color:var(--text-3);margin-bottom:30px}
.login-card .field label{font-size:13px}
.login-options{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.login-options a{font-size:12.5px;color:var(--primary)}
.login-options a:hover{text-decoration:underline}
.login-hint{margin-top:20px;text-align:center;font-size:12.5px;color:var(--text-3);background:var(--gray-bg);
  border-radius:8px;padding:9px;font-family:var(--mono)}
.login-card .err-msg{display:block;visibility:hidden}
.login-card .field.has-err .err-msg{visibility:visible}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .4s ease}

/* ---------- 弹窗 ---------- */
.dialog-overlay{position:fixed;inset:0;background:rgba(15,30,22,.5);z-index:100;display:flex;align-items:flex-start;
  justify-content:center;padding:6vh 20px 20px;animation:fadeIn .18s ease}
.dialog{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;
  max-height:88vh;display:flex;flex-direction:column;animation:dlgIn .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dlgIn{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
.dialog.wide{max-width:680px}
.dialog.narrow{max-width:440px}
.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid var(--border)}
.dialog-head h3{font-size:16px;font-weight:600}
.dialog-close{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.dialog-close:hover{background:var(--gray-bg);color:var(--text)}
.dialog-close .icon{width:16px;height:16px}
.dialog-body{padding:20px 22px;overflow-y:auto;flex:1;font-size:13.5px;line-height:1.7}
.dialog-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid var(--border);background:#FAFCFB;border-radius:0 0 14px 14px}

/* 危险确认 */
.danger-box{display:flex;gap:14px;align-items:flex-start}
.danger-box .db-icon{width:42px;height:42px;border-radius:10px;background:var(--danger-bg);color:var(--danger);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.danger-box .db-icon svg{width:20px;height:20px}
.danger-box b{font-size:15px;display:block;margin-bottom:6px}
.danger-box p{font-size:13px;color:var(--text-2);line-height:1.8}
.danger-box .warn-line{background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:9px 12px;
  font-size:12.5px;margin-top:10px;line-height:1.6}
.confirm-check{margin-top:16px}
.confirm-check label{font-size:13px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;gap:8px}
.confirm-input{margin-top:12px}
.confirm-input label{font-size:12.5px;color:var(--text-3);display:block;margin-bottom:6px}
.confirm-input input{width:100%;height:36px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:0 11px;outline:none;transition:.15s;font-size:13px}
.confirm-input input:focus{border-color:var(--danger);box-shadow:0 0 0 3px rgba(214,69,69,.1)}
.confirm-input input.matched{border-color:var(--success);box-shadow:0 0 0 3px rgba(46,125,91,.1)}

/* 向导步骤 */
.steps{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3)}
.step .step-num{width:26px;height:26px;border-radius:50%;background:var(--gray-bg);color:var(--text-3);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;transition:.2s}
.step.active{color:var(--primary);font-weight:500}
.step.active .step-num{background:var(--primary);color:#fff}
.step.done{color:var(--primary)}
.step.done .step-num{background:var(--success-bg);color:var(--primary)}
.step-line{flex:1;height:2px;background:var(--border);min-width:24px;border-radius:1px}
.step-line.done{background:var(--primary)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:5px 13px;border:1px solid var(--border-strong);border-radius:16px;font-size:12.5px;color:var(--text-2);cursor:pointer;transition:.15s;background:#fff}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.on{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark);font-weight:500}
.chip-input{width:100%;height:36px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:0 11px;outline:none}
.chip-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,125,91,.12)}

/* 权限树 */
.perm-tree{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;background:#FAFCFB}
.perm-tree .pt-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.perm-tree .pt-title .icon{width:15px;height:15px;color:var(--primary)}
.perm-tree .pt-group{margin-bottom:10px;border:1px solid var(--border);border-radius:8px;background:#fff;overflow:hidden}
.perm-tree .pt-group-head{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#F5F8F6;font-size:13px;font-weight:500;cursor:pointer;user-select:none}
.perm-tree .pt-group-head:hover{background:#EEF4F0}
.perm-tree .pt-group-head input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.perm-tree .pt-children{display:flex;flex-wrap:wrap;gap:4px 14px;padding:9px 13px 11px}
.perm-tree .pt-child{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);cursor:pointer}
.perm-tree .pt-child input{width:14px;height:14px;accent-color:var(--primary);cursor:pointer}
.perm-tree .pt-children.empty{padding:8px 13px;color:var(--text-3);font-size:12.5px}

/* ---------- Toast ---------- */
#toast-root{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);
  border-radius:9px;box-shadow:var(--shadow-lg);padding:11px 16px;min-width:260px;max-width:360px;font-size:13px;
  animation:toastIn .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast .icon{width:17px;height:17px;flex-shrink:0}
.toast-success .icon{color:var(--success)}
.toast-error .icon{color:var(--danger)}
.toast-warning .icon{color:var(--warning)}
.toast-info .icon{color:var(--info)}

/* ---------- 构建中占位 ---------- */
.build-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 0;color:var(--text-3)}
.build-placeholder .icon{width:52px;height:52px;color:#C7D1CB;margin-bottom:16px}
.build-placeholder b{font-size:16px;color:var(--text-2);margin-bottom:8px}
.build-placeholder span{font-size:13px}

/* ---------- 左右布局（权限分配） ---------- */
.split-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.role-list-card{padding:8px}
.role-item{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:9px;cursor:pointer;transition:.13s;border:1px solid transparent}
.role-item:hover{background:var(--gray-bg)}
.role-item.active{background:var(--primary-light);border-color:#BFDCCD}
.role-item .ri-avatar{width:36px;height:36px;border-radius:9px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0}
.role-item .ri-avatar svg{width:17px;height:17px}
.role-item.active .ri-avatar{background:var(--primary);color:#fff;border-color:var(--primary)}
.role-item b{display:block;font-size:13.5px;font-weight:500}
.role-item span{font-size:12px;color:var(--text-3)}

/* ---------- 通知规则 / 功能开关卡片 ---------- */
.rule-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.rule-card{padding:18px 20px;transition:box-shadow .18s}
.rule-card:hover{box-shadow:0 4px 14px rgba(22,56,42,.1)}
.rule-card .rc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rule-card .rc-title{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600}
.rule-card .rc-title .icon{width:17px;height:17px;color:var(--primary)}
.rule-card .rc-desc{font-size:12.5px;color:var(--text-3);line-height:1.7;margin-bottom:13px}
.rule-card .rc-meta{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-2)}
.rule-card .rc-meta span{display:flex;align-items:center;gap:6px}
.rule-card .rc-meta .icon{width:13px;height:13px;color:var(--text-3)}
.rule-card .rc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.rule-card .rc-foot .switch-label span{font-size:12.5px;color:var(--text-2)}
.feature-matrix th,.feature-matrix td{text-align:center}
.feature-matrix th:first-child,.feature-matrix td:first-child{text-align:left}
.feature-name-cell{display:flex;align-items:center;gap:10px}
.feature-name-cell .f-icon{width:30px;height:30px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center}
.feature-name-cell .f-icon svg{width:15px;height:15px}
.feature-name-cell b{display:block;font-size:13px}
.feature-name-cell span{font-size:11.5px;color:var(--text-3)}

/* 详情面板 */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 22px}
.detail-item .d-label{font-size:12px;color:var(--text-3);margin-bottom:3px}
.detail-item .d-value{font-size:13.5px;color:var(--text);font-weight:500}
.detail-section{border:1px solid var(--border);border-radius:10px;padding:15px 17px;margin-top:16px}
.detail-section .ds-title{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.detail-section .ds-title .icon{width:15px;height:15px;color:var(--primary)}

/* 账号列表左侧筛选 */
.tenant-picker{padding:8px;margin-bottom:14px}
.tenant-picker .select{width:100%}
.simple-list .sl-item{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:8px;transition:.12s;cursor:pointer}
.simple-list .sl-item:hover{background:var(--gray-bg)}
.simple-list .sl-item + .sl-item{border-top:1px solid var(--border)}

/* 日志页 */
.log-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.date-range{display:flex;align-items:center;gap:8px}
.date-range input{height:34px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:0 9px;outline:none;font-size:13px;color:var(--text-2)}
.date-range input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,125,91,.12)}
.undeletable-note{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);margin-top:12px}
.undeletable-note .icon{width:13px;height:13px;color:var(--warning)}
.log-content{max-width:380px}
.log-content b{font-weight:500;color:var(--text)}

/* 响应式 */
@media(max-width:1100px){
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .rule-grid{grid-template-columns:1fr}
  .field-row-3{grid-template-columns:1fr 1fr}
}
@media(max-width:900px){
  .sidebar{width:64px}
  .sidebar .logo-text,.sidebar .nav-group-title,.sidebar .nav-item span,.sidebar-foot{display:none}
  .sidebar .nav-item{justify-content:center;padding:10px;margin:2px 8px}
  .main{margin-left:64px}
  .login-left{display:none}
  .split-layout{grid-template-columns:1fr}
  .field-row,.field-row-3{grid-template-columns:1fr}
}

  function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function fmtDate(d) {
    const x = d instanceof Date ? d : new Date(d);

    const a = String(dateStr).split('-').map(Number);
    const target = new Date(a[0], a[1] - 1, a[2]);

  function pagination(total, page, pageSize, fnName) {
    const pages = Math.max(1, Math.ceil(total / pageSize));
    let html = '<div class="pagination"><span class="pg-info">共 ' + total + ' 条</span>';
    if (pages > 1) {
      html += '<button ' + (page <= 1 ? 'disabled' : '') + ' onclick="MT.' + fnName + '(' + (page - 1) + ')">上一页</button>';
      for (let i = 1; i <= pages; i++) {
        if (pages > 9 && i > 2 && i < pages - 1 && Math.abs(i - page) > 2) {
          if (i === 3 || i === pages - 2) html += '<span style="color:var(--text-3);padding:0 2px">…</span>';
          continue;
        }
        html += '<button class="' + (i === page ? 'active' : '') + '" onclick="MT.' + fnName + '(' + i + ')">' + i + '</button>';
      }
      html += '<button ' + (page >= pages ? 'disabled' : '') + ' onclick="MT.' + fnName + '(' + (page + 1) + ')">下一页</button>';

  }

  let permSel = new Set();
  let permSelType = 'menus';
  let permOnChange = null;

  function permTreeHtml(groups, prefix, withGroupBox) {
    let html = '';
    groups.forEach(g => {
      html += '<div class="pt-group">' +
        '<label class="pt-group-head"><input type="checkbox" data-prefix="' + prefix + '" data-gid="' + g.id + '" onchange="MT._permGroupChange(this)"><span>' + esc(g.label) + '</span></label>' +
        '<div class="pt-children">';
      g.children.forEach(c => {
        html += '<label class="pt-child"><input type="checkbox" value="' + c.id + '" data-prefix="' + prefix + '"' + (permSel.has(c.id) ? ' checked' : '') + ' onchange="MT._permChildChange(this)">' + esc(c.label) + '</label>';
      });
      html += '</div></div>';
    });
    return html;
  }
  function _permChildChange(input) {
    if (input.checked) permSel.add(input.value); else permSel.delete(input.value);
    syncPermTree(input.dataset.prefix);
    if (permOnChange) permOnChange();
  }
  function _permGroupChange(input) {
    const prefix = input.dataset.prefix;
    const gid = input.dataset.gid;
    const groups = (permSelType === 'menus' ? MENUS : [{ id: 'b', label: '按钮权限', children: BUTTONS.map(b => ({ id: b, label: b })) }]);
    const g = groups.find(x => x.id === gid);
    g.children.forEach(c => { if (input.checked) permSel.add(c.id); else permSel.delete(c.id); });
    syncPermTree(prefix);
    if (permOnChange) permOnChange();
  }
  function syncPermTree(prefix) {
    const groups = (permSelType === 'menus' ? MENUS : [{ id: 'b', label: '按钮权限', children: BUTTONS.map(b => ({ id: b, label: b })) }]);
    groups.forEach(g => {
      const gBox = document.querySelector('input[data-prefix="' + prefix + '"][data-gid="' + g.id + '"]');
      if (!gBox) return;
      const childBoxes = document.querySelectorAll('input[data-prefix="' + prefix + '"][value="' + g.id + '"]');
      const selN = childBoxes.length ? Array.prototype.filter.call(childBoxes, b => permSel.has(b.value)).length : 0;
      if (selN === 0) { gBox.checked = false; gBox.indeterminate = false; }
      else if (selN === childBoxes.length) { gBox.checked = true; gBox.indeterminate = false; }
      else { gBox.checked = true; gBox.indeterminate = true; }
    });
  }

  function savePwd() {
    const oldEl = $('#pwd-old'), newEl = $('#pwd-new'), cfEl = $('#pwd-confirm');

    if (oldEl.value !== '123456') { oldEl.classList.add('err'); ok = false; }

    if (cfEl.value !== newEl.value) { cfEl.classList.add('err'); ok = false; }

  /* ============================================================
     页面：租户列表（功能6）+ 开通/编辑/续期/状态/删除（功能7-10）
     ============================================================ */
  function tenantRow(t) {
    const expDays = daysUntil(t.expire);
    const statusType = t.status;
    const expiryHtml = '<div class="cell-main num">' + t.expire + '</div>' +
      (statusType === '即将到期' ? '<div class="cell-sub" style="color:var(--danger)">剩 ' + expDays + ' 天到期</div>' :
        (expDays > 0 && expDays < 30 && statusType !== '已禁用' ? '<div class="cell-sub" style="color:var(--warning)">剩 ' + expDays + ' 天到期</div>' :
          (statusType === '已禁用' ? '<div class="cell-sub">服务已停止</div>' : '<div class="cell-sub">服务正常</div>')));
    let actions = '';
    if (t.status === '正常' || t.status === '即将到期') {
      actions += '<button class="link-btn" onclick="MT.togglePause(\'' + t.id + '\')">暂停</button>';
    } else if (t.status === '已暂停') {
      actions += '<button class="link-btn" onclick="MT.togglePause(\'' + t.id + '\')">恢复</button>';
    }
    if (t.status === '已禁用') {
      actions += '<button class="link-btn" onclick="MT.toggleDisable(\'' + t.id + '\')">启用</button>';
    } else {
      actions += '<button class="link-btn gray" onclick="MT.toggleDisable(\'' + t.id + '\')">禁用</button>';
    }
    actions += '<button class="link-btn danger" onclick="MT.delTenant(\'' + t.id + '\')">删除</button>';
    return '<tr>' +
      '<td><div class="tenant-tag"><span class="t-icon">' + icon('building', 16) + '</span><div><div class="cell-main">' + esc(t.name) + '</div><div class="cell-sub">' + esc(t.region) + ' · ' + esc(t.email) + '</div></div></div></td>' +
      '<td>' + esc(t.contact) + '</td>' +
      '<td class="num">' + esc(t.phone) + '</td>' +
      '<td>' + statusBadge(t.status) + '</td>' +
      '<td>' + quotaCell(t.devUsed, t.devQuota) + '</td>' +
      '<td>' + quotaCell(t.accUsed, t.accQuota) + '</td>' +
      '<td>' + expiryHtml + '</td>' +
      '<td><div class="actions">' +
      '<button class="link-btn" onclick="MT.openTenantDetail(\'' + t.id + '\')">详情</button>' +
      '<button class="link-btn" onclick="MT.openTenantEdit(\'' + t.id + '\')">编辑</button>' +
      '<button class="link-btn" onclick="MT.openTenantRenew(\'' + t.id + '\')">续期</button>' +
      actions +
      '</div></td></tr>';
  }

  function renderTenants(page) {
    if (page) tenantPage = page;
    const kw = tenantSearch.toLowerCase();
    let list = TENANTS.filter(t =>
      (tenantStatus === '全部' || t.status === tenantStatus) &&
      (!kw || t.name.toLowerCase().includes(kw) || t.contact.includes(kw) || t.phone.replace(/-/g, '').includes(kw.replace(/-/g, ''))));
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (tenantPage > pages) tenantPage = pages;
    const rows = list.slice((tenantPage - 1) * PAGE_SIZE, tenantPage * PAGE_SIZE);
    const stats = [
      { n: TENANTS.length, label: '租户总数', ic: 'building', cls: 'green' },
      { n: TENANTS.filter(t => t.status === '正常').length, label: '正常运营', ic: 'check', cls: 'green' },
      { n: TENANTS.filter(t => t.status === '已暂停').length, label: '服务已暂停', ic: 'pause', cls: 'orange' },
      { n: TENANTS.filter(t => t.status === '即将到期').length, label: '即将到期', ic: 'alert', cls: 'red' }
    ];
    let html = pageHead('租户列表', '多租户核心数据看板：查看所有租户的基础信息、配额使用与服务状态') +
      '<div class="stat-row">' + stats.map(s =>
        '<div class="stat-card"><div class="stat-icon ' + s.cls + '">' + icon(s.ic, 22) + '</div>' +
        '<div class="stat-info"><div class="stat-num">' + s.n + '</div><div class="stat-label">' + s.label + '</div></div></div>').join('') + '</div>' +
      '<div class="card"><div class="toolbar" style="padding:14px 16px 0">' +
      '<div class="search-box">' + icon('search', 15) + '<input placeholder="搜索租户名称 / 联系人 / 电话" value="' + esc(tenantSearch) + '" oninput="MT._tenantSearch(this.value)"></div>' +
      '<select class="select" onchange="MT._tenantStatus(this.value)">' +
      ['全部', '正常', '已暂停', '已禁用', '即将到期'].map(s => '<option ' + (tenantStatus === s ? 'selected' : '') + '>' + s + '</option>').join('') +
      '</select>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-primary" onclick="MT.openTenantWizard()">' + icon('plus', 15) + '开通租户</button>' +
      '</div>' +
      '<div class="table-wrap"><table class="table"><thead><tr>' +
      '<th>租户名称</th><th>联系人</th><th>联系电话</th><th>租户状态</th><th>设备配额</th><th>账号配额</th><th>服务有效期至</th><th style="width:260px">操作</th>' +
      '</tr></thead><tbody>';
    if (!rows.length) html += '<tr><td colspan="8"><div class="table-empty">' + icon('building', 40) + '<p>未找到匹配的租户</p></div></td></tr>';
    rows.forEach(t => { html += tenantRow(t); });
    html += '</tbody></table></div>' + pagination(list.length, tenantPage, PAGE_SIZE, 'renderTenants') + '</div>';
    $('#pg-tenants').innerHTML = html;
  }
  function _tenantSearch(v) { tenantSearch = v; tenantPage = 1; renderTenants(); }
  function _tenantStatus(v) { tenantStatus = v; tenantPage = 1; renderTenants(); }

  function featTags(t) {
    const on = FEATURE_DEFS.filter(f => t.features[f.key]).map(f => f.name);
    return on.length ? on.map(n => '<span class="badge-role">' + esc(n) + '</span>').join(' ') : '<span style="color:var(--text-3);font-size:12.5px">未开通任何功能</span>';
  }

  /* ---------- 开通租户向导（功能7） ---------- */
  let wiz = { step: 1, data: {} };
  function openTenantWizard() {
    wiz = { step: 1, data: { devQuota: 100, accQuota: 20, expire: addYears(new Date(), 1) } };
    renderWizard();
  }
  function renderWizard() {
    const d = wiz.data;
    const steps = [1, 2, 3].map(n => {
      const state = n < wiz.step ? 'done' : n === wiz.step ? 'active' : '';
      return '<div class="step ' + state + '"><span class="step-num">' + (state === 'done' ? '✓' : n) + '</span>' +
        ['基本信息', '配额设置', '初始化管理员'][n - 1] + '</div>';
    }).join('<div class="step-line ' + (wiz.step > 1 ? 'done' : '') + '"></div>');
    const chip = (field, vals) => vals.map(v => '<button type="button" class="chip ' + (d[field] === v ? 'on' : '') + '" onclick="MT.wizChip(\'' + field + '\',' + v + ')">' + v + '</button>').join('');
    let body = '<div class="steps">' + steps + '</div>';
    if (wiz.step === 1) {
      body += '<div class="field-row">' +
        '<div class="field"><label>租户名称<span class="req">*</span></label><input class="input" id="w-name" value="' + esc(d.name || '') + '" placeholder="例如：秦岭国家公园"><div class="err-msg">请输入租户名称</div></div>' +
        '<div class="field"><label>所属区域</label><select class="select" id="w-region"><option>东北</option><option>西北</option><option>华南</option><option>西南</option><option>华中</option><option>华东</option></select></div></div>' +
        '<div class="field-row">' +
        '<div class="field"><label>联系人<span class="req">*</span></label><input class="input" id="w-contact" value="' + esc(d.contact || '') + '" placeholder="请输入联系人姓名"><div class="err-msg">请输入联系人</div></div>' +
        '<div class="field"><label>联系电话<span class="req">*</span></label><input class="input" id="w-phone" value="' + esc(d.phone || '') + '" placeholder="例如：13800000000"><div class="err-msg">请输入联系电话</div></div></div>' +
        '<div class="field-row">' +
        '<div class="field"><label>邮箱</label><input class="input" id="w-email" value="' + esc(d.email || '') + '" placeholder="用于接收通知邮件"></div>' +
        '<div class="field"><label>备注</label><input class="input" id="w-remark" value="' + esc(d.remark || '') + '" placeholder="选填"></div></div>';
    } else if (wiz.step === 2) {
      body += '<div class="field"><label>设备最大数量<span class="req">*</span></label>' +
        '<div class="chip-input-wrap"><input class="chip-input" type="number" id="w-dev" min="10" step="10" value="' + d.devQuota + '" oninput="MT.wizInput(\'devQuota\',this.value)">' +
        '<div class="chip-row">' + chip('devQuota', [50, 100, 200, 500]) + '</div></div>' +
        '<div class="hint">超出配额后，租户侧将无法注册新设备</div></div>' +
        '<div class="field"><label>账号最大数量<span class="req">*</span></label>' +
        '<div class="chip-input-wrap"><input class="chip-input" type="number" id="w-acc" min="5" step="5" value="' + d.accQuota + '" oninput="MT.wizInput(\'accQuota\',this.value)">' +
        '<div class="chip-row">' + chip('accQuota', [10, 20, 50, 100]) + '</div></div>' +
        '<div class="hint">租户内可创建的账号总数上限</div></div>' +
        '<div class="field"><label>服务有效期至<span class="req">*</span></label><input class="input" type="date" id="w-expire" value="' + d.expire + '" onchange="MT.wizInput(\'expire\',this.value)"><div class="hint">到期后系统将自动禁用该租户服务</div></div>';
    } else {
      body += '<div class="help-note">' + icon('info', 15) + '<span>开通后将自动为租户创建超级管理员账号，用于登录租户侧野保平台。</span></div>' +
        '<div class="field-row">' +
        '<div class="field"><label>租户管理员账号<span class="req">*</span></label><input class="input" id="w-admin-acc" value="' + esc(d.adminAcc || '') + '" placeholder="例如：admin.tls"><div class="err-msg">请输入管理员账号</div></div>' +
        '<div class="field"><label>管理员姓名<span class="req">*</span></label><input class="input" id="w-admin-name" value="' + esc(d.adminName || '') + '" placeholder="请输入姓名"><div class="err-msg">请输入姓名</div></div></div>' +
        '<div class="field-row">' +
        '<div class="field"><label>初始密码<span class="req">*</span></label><div style="display:flex;gap:8px"><input class="input" id="w-admin-pwd" type="text" value="' + esc(d.adminPwd || '') + '" placeholder="请设置初始密码" style="flex:1"><button class="btn btn-default" type="button" onclick="MT.wizGenPwd()">' + icon('refresh', 15) + '随机生成</button></div><div class="err-msg">请输入初始密码</div></div>' +
        '<div class="field"><label>确认密码<span class="req">*</span></label><input class="input" type="text" id="w-admin-pwd2" placeholder="再次输入初始密码"><div class="err-msg">两次输入的密码不一致</div></div></div>';
    }
    const footer = '<button class="btn btn-default" onclick="MT.closeDialogs()">取消</button>' +
      (wiz.step > 1 ? '<button class="btn btn-default" onclick="MT.wizPrev()">上一步</button>' : '') +
      (wiz.step < 3 ? '<button class="btn btn-primary" onclick="MT.wizNext()">下一步</button>' : '<button class="btn btn-primary" onclick="MT.wizConfirm()">' + icon('check', 15) + '确认开通</button>');
    openDialog({ title: '开通租户', cls: 'wide', body: body, footer: footer });
  }
  function wizChip(field, v) { wiz.data[field] = v; renderWizard(); }
  function wizInput(field, v) { wiz.data[field] = field === 'devQuota' || field === 'accQuota' ? (parseInt(v) || 0) : v; }
  function wizGenPwd() {
    $('#w-admin-pwd').value = 'Tenant@' + Math.random().toString(36).slice(2, 7);
    wiz.data.adminPwd = $('#w-admin-pwd').value;
  }
  function wizCollect() {
    if (wiz.step === 1) {
      wiz.data.name = $('#w-name').value.trim();
      wiz.data.region = $('#w-region').value;
      wiz.data.contact = $('#w-contact').value.trim();
      wiz.data.phone = $('#w-phone').value.trim();
      wiz.data.email = $('#w-email').value.trim();
      wiz.data.remark = $('#w-remark').value.trim();
      let ok = true;
      if (!wiz.data.name) { $('#w-name').classList.add('err'); ok = false; }
      if (!wiz.data.contact) { $('#w-contact').classList.add('err'); ok = false; }
      if (!wiz.data.phone) { $('#w-phone').classList.add('err'); ok = false; }
      return ok;
    }
    if (wiz.step === 2) {
      if (!wiz.data.expire || wiz.data.devQuota < 1 || wiz.data.accQuota < 1) { toast('请完整填写配额与有效期', 'error'); return false; }
      return true;
    }
    if (wiz.step === 3) {
      wiz.data.adminAcc = $('#w-admin-acc').value.trim();
      wiz.data.adminName = $('#w-admin-name').value.trim();
      wiz.data.adminPwd = $('#w-admin-pwd').value.trim();
      const pwd2 = $('#w-admin-pwd2').value.trim();
      let ok = true;
      if (!wiz.data.adminAcc) { $('#w-admin-acc').classList.add('err'); ok = false; }
      if (!wiz.data.adminName) { $('#w-admin-name').classList.add('err'); ok = false; }
      if (!wiz.data.adminPwd) { $('#w-admin-pwd').classList.add('err'); ok = false; }
      if (pwd2 !== wiz.data.adminPwd) { $('#w-admin-pwd2').classList.add('err'); ok = false; }
      return ok;
    }
    return true;
  }
  function wizNext() {
    if (!wizCollect()) return;
    wiz.step++; renderWizard();
  }
  function wizPrev() { wiz.step--; renderWizard(); }
  function wizConfirm() {
    if (!wizCollect()) return;
    const d = wiz.data;
    const t = {
      id: uid('t'), name: d.name, contact: d.contact, phone: d.phone, region: d.region || '其他', email: d.email || '-',
      status: '正常', devUsed: 0, devQuota: d.devQuota, accUsed: 0, accQuota: d.accQuota, expire: d.expire,
      features: { ai: true, device: true, storage: true, notify: true, report: false, collab: false }, created: todayStr()
    };
    TENANTS.unshift(t);
    TENANT_ACCOUNTS[t.id] = [{ account: d.adminAcc, name: d.adminName, role: '租户超级管理员', status: '正常', lastLogin: '—' }];
    addLifecycleLog(d.name, '开通', '新增租户，配额：设备' + d.devQuota + '/账号' + d.accQuota + '，初始化管理员 ' + d.adminAcc);
    addOpLog('租户核心管理', '开通租户「' + d.name + '」，配额：设备' + d.devQuota + '/账号' + d.accQuota, '新增');
    BELL_NOTIFS.unshift({ time: '刚刚', title: '租户开通成功', body: d.name + ' 已成功开通', read: false });
    closeDialogs();
    tenantPage = 1; tenantSearch = ''; tenantStatus = '全部';
    renderTenants();
    toast('租户「' + d.name + '」开通成功');
  }

  function saveTenantEdit(id) {
    const t = TENANTS.find(x => x.id === id);
    const nameEl = $('#te-name'), contactEl = $('#te-contact'), phoneEl = $('#te-phone');
    let ok = true;
    if (!nameEl.value.trim()) { nameEl.classList.add('err'); ok = false; }
    if (!contactEl.value.trim()) { contactEl.classList.add('err'); ok = false; }

    if (newDev < t.devUsed) { toast('设备配额不可低于已使用数量（' + t.devUsed + '）', 'error'); ok = false; }
    if (newAcc < t.accUsed) { toast('账号配额不可低于已使用数量（' + t.accUsed + '）', 'error'); ok = false; }

  /* ---------- 租户续期（功能8） ---------- */
  let renewData = {};
  function openTenantRenew(id) {
    const t = TENANTS.find(x => x.id === id);
    renewData = { tenantId: id, mode: '1y' };
    renderRenew(t);
  }
  function renderRenew(t) {
    const rd = renewData;
    const newExp = rd.mode === '1y' ? addYears(t.expire, 1) : rd.mode === '2y' ? addYears(t.expire, 2) : (rd.custom || t.expire);
    const radio = (mode, label, sub) => '<label style="display:flex;align-items:center;gap:9px;border:1px solid ' + (rd.mode === mode ? 'var(--primary)' : 'var(--border-strong)') + ';border-radius:8px;padding:11px 13px;cursor:pointer;background:' + (rd.mode === mode ? 'var(--primary-light)' : '#fff') + '" onclick="MT.renewMode(\'' + mode + '\',\'' + t.id + '\')"><input type="radio" name="renew" ' + (rd.mode === mode ? 'checked' : '') + ' style="accent-color:var(--primary)"><span style="font-size:13.5px;color:var(--text)">' + label + '</span><span style="font-size:12px;color:var(--text-3)">' + sub + '</span></label>';
    openDialog({
      title: '服务续期 · ' + t.name,
      body:
        '<div class="detail-item" style="margin-bottom:16px"><div class="d-label">当前服务有效期至</div><div class="d-value">' + esc(t.expire) + '（' + (daysUntil(t.expire) > 0 ? '剩 ' + daysUntil(t.expire) + ' 天' : '已到期') + '）</div></div>' +
        '<div style="display:flex;flex-direction:column;gap:9px">' + radio('1y', '续期 1 年', '到期后顺延 365 天') + radio('2y', '续期 2 年', '到期后顺延 730 天') + '</div>' +
        '<div class="field" style="margin-top:14px"><label>或自定义到期日期</label><input class="input" type="date" id="rn-custom" value="' + (rd.custom || '') + '" onchange="MT.renewCustom(this.value)"></div>' +
        '<div class="help-note" style="margin-top:14px;margin-bottom:0">' + icon('calendar', 15) + '<span>续期后新有效期：<b>' + esc(newExp) + '</b>。续期操作会同时通知租户联系人。</span></div>',
      footer:
        '<button class="btn btn-default" onclick="MT.closeDialogs()">取消</button>' +
        '<button class="btn btn-primary" onclick="MT.saveRenew()">' + icon('check', 15) + '确认续期</button>'
    });
  }
  function renewMode(m, tid) { renewData.mode = m; renderRenew(TENANTS.find(x => x.id === tid)); }
  function renewCustom(v) { if (v) { renewData.mode = 'custom'; renewData.custom = v; } }
  function saveRenew() {
    const t = TENANTS.find(x => x.id === renewData.tenantId);
    const newExp = renewData.mode === '1y' ? addYears(t.expire, 1) : renewData.mode === '2y' ? addYears(t.expire, 2) : (renewData.custom || addYears(t.expire, 1));
    t.expire = newExp;
    if (t.status === '已禁用') { t.status = '正常'; }
    if (t.status === '即将到期') { t.status = '正常'; }
    addLifecycleLog(t.name, '续期', '服务有效期延长至 ' + newExp);
    addOpLog('租户核心管理', '续期租户「' + t.name + '」服务至 ' + newExp, '续期');
    BELL_NOTIFS.unshift({ time: '刚刚', title: '续期成功', body: t.name + ' 服务已续期至 ' + newExp, read: false });
    closeDialogs(); renderTenants();
    toast('租户「' + t.name + '」服务已续期至 ' + newExp);
  }

  /* ---------- 租户状态管控（功能9） ---------- */

      title: toPause ? '暂停租户服务' : '恢复租户服务', type: toPause ? 'warning' : 'info',
      message: (toPause ? '暂停' : '恢复') + '租户「' + t.name + '」的服务？',
      desc: toPause ? '暂停后租户侧所有账号将无法登录使用，但数据将完整保留' : '恢复后租户侧可立即恢复正常使用',
      confirmText: toPause ? '确认暂停' : '确认恢复',
      onConfirm: function () {
        t.status = toPause ? '已暂停' : '正常';
        addLifecycleLog(t.name, toPause ? '暂停' : '恢复', toPause ? '暂停租户服务，租户侧账号暂时无法登录' : '恢复暂停的租户服务');

  let delTenantReady = false;
  function delTenant(id) {
    const t = TENANTS.find(x => x.id === id);
    window.MT._delTid = id;
    window.MT._delTyped = false;
    openDialog({
      title: '删除租户 · ' + t.name, cls: 'narrow',
      body:
        '<div class="danger-box"><div class="db-icon">' + icon('alert', 20) + '</div><div><b>此操作不可恢复，请谨慎确认</b>' +
        '<p>删除后，该租户关联的基础数据（设备、账号、影像、日志等）将全部清空，且无法恢复。</p>' +
        '<div class="warn-line">高危操作：请确保该租户无未导出的重要数据</div></div></div>' +
        '<div class="confirm-check"><label><input type="checkbox" id="del-chk" onchange="MT._delCheck(this.checked)"> 我已了解删除后数据不可恢复的风险</label></div>' +
        '<div class="confirm-input"><label>请输入租户名称「' + esc(t.name) + '」以确认删除</label>' +
        '<input id="del-input" placeholder="请输入租户名称" oninput="MT._delInput(this.value)"></div>',
      footer:
        '<button class="btn btn-default" onclick="MT.closeDialogs()">取消</button>' +
        '<button class="btn btn-danger" id="del-btn" disabled onclick="MT._delTenantFinal(\'' + t.id + '\')">确认删除</button>'
    });

  }
  function _delCheck(v) { delTenantReady = v && (window.MT._delTyped || false); $('#del-btn').disabled = !delTenantReady; }
  function _delInput(v) {
    const t = TENANTS.find(x => x.id === window.MT._delTid);
    const match = v === t.name;
    window.MT._delTyped = match;
    const input = $('#del-input');
    input.classList.toggle('matched', match);
    delTenantReady = match && $('#del-chk').checked;
    $('#del-btn').disabled = !delTenantReady;
  }
  function _delTenantFinal(id) {
    const t = TENANTS.find(x => x.id === id);

    addLifecycleLog(t.name, '删除', '删除租户及其全部关联基础数据');
    addOpLog('租户核心管理', '删除租户「' + t.name + '」及其关联数据', '删除');

  function saveTemplate(tpId) {
    const nameEl = $('#tp-name'), codeEl = $('#tp-code');

    if (!nameEl.value.trim()) { nameEl.classList.add('err'); ok = false; }
    if (!codeEl.value.trim()) { codeEl.classList.add('err'); ok = false; }
    const feats = Array.prototype.filter.call($$('.tp-feat'), i => i.checked).map(i => i.value);
    if (!feats.length) { toast('请至少勾选一项功能权限', 'error'); ok = false; }

    if (tpId === 'new') {
      TEMPLATES.push({ id: uid('tp'), name: nameEl.value.trim(), code: codeEl.value.trim().toUpperCase(), desc: $('#tp-desc').value || '—', feats: feats, created: fmtDate(new Date()), builtin: false });

  function saveRule(ruleId) {
    const nameEl = $('#rule-name');
    if (!nameEl.value.trim()) { nameEl.classList.add('err'); return; }
    const chs = Array.prototype.filter.call($$('.rule-ch'), i => i.checked).map(i => i.value);
    if (!chs.length) { toast('请至少选择一种通知方式', 'error'); return; }
    if (ruleId === 'new') {
      NOTIF_RULES.push({ id: uid('nr'), name: nameEl.value.trim(), desc: '自定义通知规则', trigger: $('#rule-trigger').value, channels: chs, target: $('#rule-target').value, status: '启用' });
      addOpLog('消息通知', '新增通知规则「' + nameEl.value.trim() + '」', '新增');
      toast('通知规则创建成功');
    } else {
      const r = NOTIF_RULES.find(x => x.id === ruleId);
      r.name = nameEl.value.trim(); r.trigger = $('#rule-trigger').value; r.target = $('#rule-target').value; r.channels = chs;
      addOpLog('消息通知', '编辑通知规则「' + r.name + '」', '编辑');
      toast('通知规则已更新');
    }
    closeDialogs(); renderNotifRules();
  }
  function delRule(ruleId) {
    const r = NOTIF_RULES.find(x => x.id === ruleId);
    confirmBox({
      title: '删除规则', type: 'danger',
      message: '确定删除通知规则「' + r.name + '」？',
      desc: '删除后该场景将不再自动发送通知',
      confirmText: '确认删除',
      onConfirm: function () {
        NOTIF_RULES.splice(NOTIF_RULES.indexOf(r), 1);
        addOpLog('消息通知', '删除通知规则「' + r.name + '」', '删除');
        toast('规则「' + r.name + '」已删除');
        renderNotifRules();
      }
    });
  }

  let notifRecKw = '', notifRecType = '全部', notifRecStatus = '全部';
  function renderNotifRecords(page) {
    if (page) notifRecPage = page;
    let list = NOTIF_RECORDS.filter(n =>
      (notifRecType === '全部' || n.type === notifRecType) &&
      (notifRecStatus === '全部' || n.status === notifRecStatus) &&
      (!notifRecKw || n.tenant.includes(notifRecKw) || n.contact.includes(notifRecKw) || n.content.includes(notifRecKw)));
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (notifRecPage > pages) notifRecPage = pages;
    const rows = list.slice((notifRecPage - 1) * PAGE_SIZE, notifRecPage * PAGE_SIZE);
    const chBadge = { '站内信': 'info', '邮件': 'success' };
    const stBadge = { '已发送': 'success', '已读': 'gray', '未读': 'info', '失败': 'danger' };
    let html = pageHead('通知记录', '查看所有通知的发送记录与接收状态') +
      '<div class="log-toolbar">' +
      '<div class="search-box">' + icon('search', 15) + '<input placeholder="搜索租户 / 联系人 / 内容" value="' + esc(notifRecKw) + '" oninput="MT._notifRecKw(this.value)"></div>' +
      '<select class="select" onchange="MT._notifRecType(this.value)">' + ['全部'].concat(NOTIF_RULES.map(r => r.name)).map(o => '<option ' + (o === notifRecType ? 'selected' : '') + '>' + o + '</option>').join('') + '</select>' +
      '<select class="select" onchange="MT._notifRecStatus(this.value)">' + ['全部', '已发送', '已读', '未读', '失败'].map(o => '<option ' + (o === notifRecStatus ? 'selected' : '') + '>' + o + '</option>').join('') + '</select>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-default" onclick="MT.toast(\'演示环境：已生成导出文件 通知记录.xlsx\',\'success\')">' + icon('bar', 15) + '导出</button>' +
      '</div>' +
      '<div class="card"><div class="table-wrap"><table class="table"><thead><tr>' +
      '<th style="width:150px">通知时间</th><th>通知类型</th><th>接收人</th><th style="width:90px">渠道</th><th>内容摘要</th><th style="width:90px">发送状态</th>' +
      '</tr></thead><tbody>';
    if (!rows.length) html += '<tr><td colspan="6"><div class="table-empty">' + icon('mail', 40) + '<p>没有符合条件的通知记录</p></div></td></tr>';
    rows.forEach(n => {
      html += '<tr><td class="num">' + n.time + '</td>' +
        '<td>' + esc(n.type) + '</td>' +
        '<td><div class="cell-main">' + esc(n.tenant) + '</div><div class="cell-sub">' + esc(n.contact) + '</div></td>' +
        '<td>' + badge(n.channel, chBadge[n.channel] || 'gray', false) + '</td>' +
        '<td class="log-content"><b>' + esc(n.content) + '</b></td>' +
        '<td>' + badge(n.status, stBadge[n.status] || 'gray') + '</td></tr>';
    });
    html += '</tbody></table></div>' + pagination(list.length, notifRecPage, PAGE_SIZE, 'renderNotifRecords') + '</div>';
    $('#pg-notif-records').innerHTML = html;
  }
  function _notifRecKw(v) { notifRecKw = v; notifRecPage = 1; renderNotifRecords(); }
  function _notifRecType(v) { notifRecType = v; notifRecPage = 1; renderNotifRecords(); }
  function _notifRecStatus(v) { notifRecStatus = v; notifRecPage = 1; renderNotifRecords(); }

  /* ===================== 初始化 ===================== */
  function init() {
    $('#logo-icon').innerHTML = icon('paw', 20);
    $('#logo-icon-lg').innerHTML = icon('paw', 24);
    $('#lg-user-icon').innerHTML = icon('user', 16);
    $('#lg-pass-icon').innerHTML = icon('lock', 16);
    $('#login-eye').innerHTML = icon('eye', 16);
    $('#ll-p1').innerHTML = icon('check', 17);
    $('#ll-p2').innerHTML = icon('check', 17);
    $('#ll-p3').innerHTML = icon('check', 17);
    $('#login-form').addEventListener('submit', doLogin);
    ['login-user', 'login-pass'].forEach(id => {
      $('#' + id).addEventListener('input', function () {
        const f = id === 'login-user' ? $('#lg-user-field') : $('#lg-pass-field');
        f.classList.remove('has-err'); this.classList.remove('err');
      });
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.topbar-right')) closeDropAll();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeDialogs(); closeDropAll(); }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  /* ===================== 公开 API ===================== */
  return {
    icon: icon, esc: esc, toast: toast, closeDialogs: closeDialogs, confirmBox: confirmBox,
    showPage: showPage, togglePwd: togglePwd, doLogin: doLogin, doLogout: doLogout,
    toggleDrop: toggleDrop, closeDropAll: closeDropAll,
    openChangePwd: function () { renderProfile(); showPage('page-profile'); },
    runConfirm: runConfirm,
    _swChange: _swChange, _swRegister: _swRegister,
    /* 平台权限管理 */
    renderAccounts: renderAccounts, renderRoles: renderRoles, renderPermissions: renderPermissions, renderProfile: renderProfile,
    openAdminModal: openAdminModal, saveAdmin: saveAdmin, delAdmin: delAdmin, toggleAdmin: toggleAdmin, resetPwdModal: resetPwdModal, _accSearch: _accSearch,
    openRoleModal: openRoleModal, saveRole: saveRole, delRole: delRole,
    openRolePermModal: openRolePermModal, saveRolePerms: saveRolePerms, savePermAssign: savePermAssign, pickPermRole: pickPermRole,
    savePwd: savePwd,
    _permChildChange: _permChildChange, _permGroupChange: _permGroupChange,
    /* 租户核心管理 */
    renderTenants: renderTenants,
    openTenantWizard: openTenantWizard, wizNext: wizNext, wizPrev: wizPrev, wizChip: wizChip, wizInput: wizInput, wizGenPwd: wizGenPwd, wizConfirm: wizConfirm,
    openTenantEdit: openTenantEdit, saveTenantEdit: saveTenantEdit, openTenantDetail: openTenantDetail,
    openTenantRenew: openTenantRenew, renewMode: renewMode, renewCustom: renewCustom, saveRenew: saveRenew,
    togglePause: togglePause, toggleDisable: toggleDisable, delTenant: delTenant,
    _tenantSearch: _tenantSearch, _tenantStatus: _tenantStatus,
    _delCheck: _delCheck, _delInput: _delInput, _delTenantFinal: _delTenantFinal,
    /* 租户权限管控 */
    renderTemplates: renderTemplates, renderTenantAccounts: renderTenantAccounts, renderFeatureSwitches: renderFeatureSwitches,
    openTemplateModal: openTemplateModal, saveTemplate: saveTemplate, delTemplate: delTemplate,
    toggleTenantAcc: toggleTenantAcc, resetTenantAccPwd: resetTenantAccPwd, _acctTenant: _acctTenant, _fsTenant: _fsTenant,
    /* 日志审计 */
    renderOpLogs: renderOpLogs, renderLifecycleLogs: renderLifecycleLogs, renderLoginLogs: renderLoginLogs,
    _logKw: _logKw, _logType: _logType, _logFrom: _logFrom, _logTo: _logTo,
    /* 消息通知 */
    renderNotifRules: renderNotifRules, renderNotifRecords: renderNotifRecords,
    openRuleModal: openRuleModal, saveRule: saveRule, delRule: delRule,
    _notifRecKw: _notifRecKw, _notifRecType: _notifRecType, _notifRecStatus: _notifRecStatus
  };
})();
/*__JS_APPEND__*/
</script>
</body>
</html>
